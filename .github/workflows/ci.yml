name: CI

# Runs make check (format, lint, mypy --strict, tests) and the lessons
# check. Nothing here needs a camera, a GPU or a secret (CLAUDE.md 37).
#
# Minutes: GitHub bills private repositories' Actions time against the
# account's monthly allowance, which ran out on Playthroughd on 2026-10-14
# (its docs/lessons.md). This workflow runs on pull requests and on main
# after a merge only, not on every branch push, and takes about a minute.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every run step is bash with pipefail: GitHub's default shell is plain
# `bash -e`, which hides a failure before a pipe (docs/lessons.md; enforced
# by .github/scripts/pipefail.sh).
defaults:
  run:
    shell: bash

jobs:
  lessons:
    name: Lessons — every fix records what it taught
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A stacked pull request merges into its base branch, not main, even
      # after that base has merged: PR #9's change was lost that way
      # (docs/lessons.md). A step here rather than its own job, because each
      # job is billed at least a minute.
      - name: Pull requests merge into main
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != main ]; then
            echo "This pull request merges into '$BASE_REF', not main. Point it at main before merging."
            exit 1
          fi
      - name: Every fix commit adds to docs/lessons.md
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .github/scripts/lessons.sh "$BASE..$HEAD"
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            .github/scripts/lessons.sh "$BEFORE..$AFTER"
          else
            .github/scripts/lessons.sh "$AFTER^!"
          fi

  check:
    name: make check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 3.12 only: the Mac and the desktop run it (.python-version), and with
    # no Jetson there is no 3.10 fallback to test (ADR 0011). One job saves
    # a minute of the Actions allowance on every push.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes full versions only (no v10 tag): checked by
      # .github/scripts/action_refs.sh in make check.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make check
