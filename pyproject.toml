[project]
name = "roundabout-watch"
version = "0.1.0"
description = "Flags near-misses and possible crashes at a roundabout from one fixed camera, for a person to review."
readme = "README.md"
# The Jetson runs Python 3.12 (JetPack 7.2.1); 3.10 is kept so JetPack 6.2
# stays a fallback (ADR 0003). Don't use syntax newer than 3.10 while it is.
requires-python = ">=3.10"
# Runtime dependencies are added with the stage that needs them, each with
# its reason and licence in docs/architecture.md (CLAUDE.md 24, 25).
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roundabout_watch"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, and flake8-bandit
# for the security checks (hard-coded passwords, shell injection, SQL built
# from strings: CLAUDE.md 15 and 18).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest's plain assert is the point of a test.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
