[project]
name = "roundabout-watch"
version = "0.1.0"
description = "Flags near-misses and possible crashes at a roundabout from one fixed camera, for a person to review."
readme = "README.md"
# PyAV 19 needs Python 3.12, and with the Jetson gone there's no older
# fallback to keep (ADR 0011). .python-version pins the Mac and the desktop
# to the 3.12 that CI tests.
requires-python = ">=3.12"
# Runtime dependencies are added with the stage that needs them, each with
# its reason and licence in docs/architecture.md (CLAUDE.md 24, 25).
dependencies = [
    "altair>=6.3.0",
    "av>=19.0.1",
    "numpy>=2.0.2",
    # findHomography for ground.py. trackers already brings this same
    # package; named here because ground.py imports it directly.
    "opencv-python>=5.0.0.93",
    # Reads calibration.yaml. Already brought by supervision and trackers.
    "pyyaml>=6.0.3",
    "streamlit>=1.66.0",
    # Tells the Calibrate page where on the frame a person clicked; Streamlit
    # can't. About 150 lines, MIT, read in full on 2026-10-24: it fetches
    # nothing unless given a web address, and it's only given the frame.
    # Pinned so a new release is read before it's used.
    "streamlit-image-coordinates==0.4.1",
    "supervision>=0.31.0",
    "trackers>=2.6.1",
]

[project.optional-dependencies]
# RF-DETR brings PyTorch, gigabytes of it, so CI never installs it
# (CLAUDE.md 37). On the Mac or the desktop: `uv sync --extra detector`.
# torch and torchvision come with rfdetr anyway; they're named here only
# because uv applies [tool.uv.sources] to direct dependencies alone.
detector = ["rfdetr>=1.11.2", "torch>=2.14.1", "torchvision>=0.29.1"]

# PyPI's PyTorch for Windows runs on the CPU only, so on the desktop it
# comes from PyTorch's own CUDA 13.0 index instead, to use the 3080 Ti
# (ADR 0011). The Mac and Linux keep PyPI's: the marker limits this to
# Windows. explicit = true keeps every other package on PyPI. Shape from
# uv's PyTorch guide: https://docs.astral.sh/uv/guides/integration/pytorch/
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    # PyYAML ships no types, and mypy --strict needs them.
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roundabout_watch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, and flake8-bandit
# for the security checks (hard-coded passwords, shell injection, SQL built
# from strings: CLAUDE.md 15 and 18).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest's plain assert is the point of a test.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# rfdetr is in the "detector" extra, which CI doesn't install. Where it is
# installed, mypy checks against its own types (it ships py.typed).
module = ["rfdetr", "rfdetr.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Ships no type information.
module = ["streamlit_image_coordinates"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
